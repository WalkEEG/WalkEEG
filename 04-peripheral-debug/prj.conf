#
# WalkEEG debug peripheral for QingFeng nRF52832 (nrf52dk/nrf52832)
#
# Role: BLE peripheral + NUS. Phone app sends BALANX2-style commands
#       over NUS; board decodes and prints over UART0 -> CH340 -> PC.
#
# SPDX-License-Identifier: LicenseRef-Nordic-5-Clause
#

# UART (CH340 USB-UART bridge on P0.06/P0.08 at 115200)
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE=y
CONFIG_GPIO=y

# printk/log go to UART console (no RTT on nRF52)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_USE_SEGGER_RTT=n

CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BALANX"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# NUS service
CONFIG_BT_NUS=y

# Bonding / settings (optional but harmless)
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Small RAM budget for nRF52832 (64KB)
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_NUS_THREAD_STACK_SIZE=1024

# Logger: immediate mode to avoid a dedicated log thread
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_LOG_DEFAULT_LEVEL=4

CONFIG_ASSERT=y
